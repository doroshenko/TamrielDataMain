name: Spellcheck Tamriel_Data

on:
  workflow_dispatch:

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tamriel_Data.esm exists
        run: |
          test -f "00 Data Files/Tamriel_Data.esm"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          npm install -g cspell

      - name: Download latest tes3conv
        run: |
          curl -s \
            https://api.github.com/repos/Greatness7/tes3conv/releases/latest \
            > tes3conv-release.json

          URL=$(jq -r '
            .assets[]
            | select(.name == "ubuntu-latest.zip")
            | .browser_download_url
          ' tes3conv-release.json)

          echo "Downloading $URL"

          curl -L "$URL" -o tes3conv.zip

          unzip tes3conv.zip -d tes3conv

          chmod +x tes3conv/tes3conv

      - name: Convert ESM to JSON
        run: |
          ./tes3conv/tes3conv \
            "00 Data Files/Tamriel_Data.esm" \
            Tamriel_Data.json
            
      - name: Create spellcheck script
        run: |
          cat > spellcheck_json.py <<'PY'
          import json
          import re
          import subprocess
          import tempfile
          from collections import Counter
          from pathlib import Path
          
          JSON_FILE = "Tamriel_Data.json"
          
          #
          # Fields that should be spellchecked
          #
          SPELLCHECK_FIELDS = {
              "text",
          }
          
          #
          # Fields used for dictionary generation
          #
          DICTIONARY_FIELDS = {
              "name",
              "race",
              "class",
              "faction",
              "region",
          }
          
          word_frequency = Counter()
          dictionary_words = set()
          
          spellcheck_strings = []
          
          
          def tokenize(text):
              return re.findall(r"[A-Za-z][A-Za-z'-]*", text)
          
          
          def collect_dictionary_words(text):
              for word in tokenize(text):
                  if len(word) >= 3:
                      dictionary_words.add(word)
                      word_frequency[word] += 1
          
          
          def walk(obj, path="", key=None):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      next_path = f"{path}.{k}" if path else k
                      walk(v, next_path, k)
          
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      walk(v, f"{path}[{i}]", key)
          
              elif isinstance(obj, str):
                  text = obj.strip()
          
                  if len(text) < 3:
                      return
          
                  #
                  # Build dictionary
                  #
                  if key in DICTIONARY_FIELDS:
                      collect_dictionary_words(text)
          
                  #
                  # Gather strings to spellcheck
                  #
                  if key in SPELLCHECK_FIELDS:
                      spellcheck_strings.append((path, key, text))
          
          
          print("Loading JSON...")
          
          with open(JSON_FILE, encoding="utf-8") as f:
              data = json.load(f)
          
          walk(data)
          
          #
          # Add frequently-occurring words from ALL checked text
          #
          for _, _, text in spellcheck_strings:
              for word in tokenize(text):
                  if len(word) >= 3:
                      word_frequency[word] += 1
          
          #
          # Whitelist common lore words that appear repeatedly.
          # A typo that occurs only once won't be added.
          #
          FREQUENCY_THRESHOLD = 5
          
          for word, count in word_frequency.items():
              if count >= FREQUENCY_THRESHOLD:
                  dictionary_words.add(word)
          
          print(f"Generated dictionary with {len(dictionary_words)} words")
          
          dictionary_file = "tamriel-dictionary.txt"
          
          with open(dictionary_file, "w", encoding="utf-8") as f:
              for word in sorted(dictionary_words):
                  f.write(word + "\n")
          
          findings = []
          
          for path, field, text in spellcheck_strings:
              with tempfile.NamedTemporaryFile(
                  mode="w",
                  encoding="utf-8",
                  suffix=".txt",
                  delete=False,
              ) as tmp:
                  tmp.write(text)
                  tmp_filename = tmp.name
          
              result = subprocess.run(
                  [
                      "cspell",
                      "--no-progress",
                      "--no-summary",
                      "--words",
                      dictionary_file,
                      tmp_filename,
                  ],
                  capture_output=True,
                  text=True,
              )
          
              Path(tmp_filename).unlink(missing_ok=True)
          
              if result.returncode != 0:
                  findings.append(
                      {
                          "path": path,
                          "field": field,
                          "text": text,
                          "output": result.stdout.strip(),
                      }
                  )
          
          with open("spellcheck-report.md", "w", encoding="utf-8") as report:
              report.write("# Tamriel Data Spellcheck Report\n\n")
          
              report.write(
                  f"Checked **{len(spellcheck_strings)}** player-facing strings.\n\n"
              )
          
              report.write(
                  f"Generated custom dictionary with **{len(dictionary_words)}** lore-specific words.\n\n"
              )
          
              report.write("## Checked Fields\n\n")
          
              for field in sorted(SPELLCHECK_FIELDS):
                  report.write(f"- `{field}`\n")
          
              report.write("\n")
          
              if not findings:
                  report.write("No spelling issues found.\n")
              else:
                  report.write(f"## Findings ({len(findings)} entries)\n\n")
          
                  for item in findings:
                      report.write(f"### {item['path']}\n\n")
          
                      report.write(
                          f"**Field:** `{item['field']}`\n\n"
                      )
          
                      report.write("#### Text\n\n")
                      report.write("```text\n")
                      report.write(item["text"][:5000])
                      report.write("\n```\n\n")
          
                      report.write("#### CSpell Output\n\n")
                      report.write("```\n")
                      report.write(item["output"])
                      report.write("\n```\n\n")
          
          print(
              f"Spellchecked {len(spellcheck_strings)} strings. "
              f"Found {len(findings)} possible issues."
          )
          PY

      - name: Run spellcheck
        run: |
          python3 spellcheck_json.py

      - name: Upload spellcheck report
        uses: actions/upload-artifact@v4
        with:
          name: spellcheck-report
          path: spellcheck-report.md
