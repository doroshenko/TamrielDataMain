name: Spellcheck Tamriel_Data

on:
  workflow_dispatch:

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: "00 Data Files"
          sparse-checkout-cone-mode: false

      - name: Verify Tamriel_Data.esm exists
        run: |
          test -f "00 Data Files/Tamriel_Data.esm"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip
          npm install -g cspell

      - name: Download latest tes3conv
        run: |
          curl -s \
            https://api.github.com/repos/Greatness7/tes3conv/releases/latest \
            > tes3conv-release.json

          URL=$(jq -r '
            .assets[]
            | select(.name == "ubuntu-latest.zip")
            | .browser_download_url
          ' tes3conv-release.json)

          echo "Downloading $URL"

          curl -L "$URL" -o tes3conv.zip

          unzip tes3conv.zip -d tes3conv

          chmod +x tes3conv/tes3conv

      - name: Convert ESM to JSON
        run: |
          ./tes3conv/tes3conv \
            "00 Data Files/Tamriel_Data.esm" \
            Tamriel_Data.json

      - name: Create spellcheck config
        run: |
          cat > cspell.json <<'EOF'
          {
            "dictionaries": ["tamriel-dictionary"],

            "dictionaryDefinitions": [
                  {
                      "name": "tamriel-dictionary",
                      "path": "tamriel-dictionary.txt",
                      "addWords": true
                  }
              ]
          }
          EOF
            
      - name: Create spellcheck script
        run: |
          cat > spellcheck_json.py <<'PY'
          import json
          import re
          import subprocess
          from collections import Counter
          
          JSON_FILE = "Tamriel_Data.json"
          
          PLAYER_FACING_RECORDS = {
              "Book",
              "DialogueInfo",
              "DialogTopic",
              "Journal",
              "Npc",
              "Creature",
              "Weapon",
              "Armor",
              "Clothing",
              "MiscItem",
              "Ingredient",
              "Apparatus",
              "Alchemy",
              "RepairItem",
              "Probe",
              "Lockpick",
              "Cell",
              "Region",
              "Race",
              "Class",
              "Birthsign",
              "Faction",
          }
          
          #
          # Fields that contain player-visible text and should be spellchecked.
          #
          SPELLCHECK_FIELDS = {
              "text",
          }
          
          #
          # Fields used to build a custom lore dictionary.
          #
          DICTIONARY_FIELDS = {
              "name",
              "race",
              "class",
              "faction",
              "region",
              "topic",
          }
          
          #
          # Words appearing at least this many times are automatically
          # added to the custom dictionary.
          #
          FREQUENCY_THRESHOLD = 5
          
          word_frequency = Counter()
          dictionary_words = set()
          spellcheck_strings = []
          
          
          def tokenize(text):
              return re.findall(r"[A-Za-z][A-Za-z'-]*", text)
          
          
          def collect_dictionary_words(text):
              for word in tokenize(text):
                  if len(word) >= 3:
                      dictionary_words.add(word)
                      word_frequency[word] += 1
          
          
          def walk(obj, path="", key=None, record_type=None, record_id=None):
              if isinstance(obj, dict):
                  current_record_type = record_type
                  current_record_id = record_id
          
                  #
                  # tes3conv records have type and id.
                  #
                  if "type" in obj and isinstance(obj["type"], str):
                      current_record_type = obj["type"]
          
                  if "id" in obj and isinstance(obj["id"], str):
                      current_record_id = obj["id"]
          
                  for k, v in obj.items():
                      next_path = f"{path}.{k}" if path else k
          
                      walk(
                          v,
                          next_path,
                          k,
                          current_record_type,
                          current_record_id,
                      )
          
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      walk(
                          v,
                          f"{path}[{i}]",
                          key,
                          record_type,
                          record_id,
                      )
          
              elif isinstance(obj, str):
                  text = obj.strip()
          
                  if len(text) < 3:
                      return
          
                  #
                  # Build dictionary from lore/proper-name fields.
                  #
                  if key in DICTIONARY_FIELDS:
                      collect_dictionary_words(text)
          
                  #
                  # Only spellcheck player-visible fields belonging
                  # to player-facing records.
                  #
                  if (
                      record_type in PLAYER_FACING_RECORDS
                      and key in SPELLCHECK_FIELDS
                  ):
                      spellcheck_strings.append(
                          {
                              "path": path,
                              "record_type": record_type,
                              "record_id": record_id,
                              "field": key,
                              "text": text,
                          }
                      )
          
          
          print("Loading JSON...")
          
          with open(JSON_FILE, encoding="utf-8") as f:
              data = json.load(f)
          
          walk(data)
          
          #
          # Learn common words from the spellchecked text itself.
          #
          for item in spellcheck_strings:
              for word in tokenize(item["text"]):
                  if len(word) >= 3:
                      word_frequency[word] += 1
          
          #
          # Add frequent words to dictionary.
          #
          for word, count in word_frequency.items():
              if count >= FREQUENCY_THRESHOLD:
                  dictionary_words.add(word)
          
          dictionary_file = "tamriel-dictionary.txt"
          
          with open(dictionary_file, "w", encoding="utf-8") as f:
              for word in sorted(dictionary_words):
                  f.write(word + "\n")
          
          print(
              f"Prepared {len(spellcheck_strings)} strings and "
              f"{len(dictionary_words)} dictionary words"
          )
          
          #
          # Build a single payload for cspell.
          #
          payload_lines = []
          line_map = {}
          
          current_line = 1
          
          for item in spellcheck_strings:
              start_line = current_line
          
              text_lines = item["text"].splitlines()
          
              if not text_lines:
                  text_lines = [""]
          
              payload_lines.extend(text_lines)
          
              current_line += len(text_lines)
          
              end_line = current_line - 1
          
              line_map[(start_line, end_line)] = item
          
              #
              # Separator line between entries.
              #
              payload_lines.append("")
              current_line += 1
          
          payload = "\n".join(payload_lines)
          
          with open("payload.txt", "w", encoding="utf-8") as f:
              f.write(payload)
          
          print("Running cspell...")
          
          result = subprocess.run(
              [
                  "cspell",
                  "--no-progress",
                  "--no-summary",
                  "payload.txt",
              ],
              capture_output=True,
              text=True,
          )
          
          print(f"Line {result}")
          
          #
          # Parse cspell output.
          #
          #
          # Expected formats include:
          # stdin:123:5 - Unknown word (Foobar)
          # <stdin>:123:5 - Unknown word (Foobar)
          #
          line_pattern = re.compile(
              r"(?:stdin|<stdin>|payload.txt):(\d+):(\d+).*?Unknown word\s+\(([^)]+)\)",
              re.IGNORECASE,
          )
          
          issues_by_path = {}
          
          for line in result.stdout.splitlines():
              match = line_pattern.search(line)
          
              print(f"Line {line}")
          
              if not match:
                  continue
          
              line_number = int(match.group(1))
              unknown_word = match.group(3)
          
              for (start, end), metadata in line_map.items():
                  if start <= line_number <= end:
                      path = metadata["path"]
          
                      if path not in issues_by_path:
                          issues_by_path[path] = {
                              "record_id": metadata["record_id"],
                              "field": metadata["field"],
                              "text": metadata["text"],
                              "words": set(),
                          }
          
                      issues_by_path[path]["words"].add(unknown_word)
                      break
          
          findings = []
          
          for path, info in sorted(issues_by_path.items()):
              findings.append(
                  {
                      "path": path,
                      "record_id": info["record_id"],
                      "field": info["field"],
                      "text": info["text"],
                      "words": sorted(info["words"]),
                  }
              )
          
          with open("spellcheck-report.md", "w", encoding="utf-8") as report:
              report.write("# Tamriel Data Spellcheck Report\n\n")
          
              report.write(
                  f"Checked **{len(spellcheck_strings)}** player-facing strings.\n\n"
              )
          
              report.write(
                  f"Generated custom dictionary with "
                  f"**{len(dictionary_words)}** words.\n\n"
              )
          
              report.write("## Checked Fields\n\n")
          
              for field in sorted(SPELLCHECK_FIELDS):
                  report.write(f"- `{field}`\n")
          
              report.write("\n")
          
              if not findings:
                  report.write("No spelling issues found.\n")
              else:
                  report.write(f"## Findings ({len(findings)} entries)\n\n")
          
                  for item in findings:
                      report.write(f"**Item ID:** `{item['record_id']}`\n\n")
          
                      report.write(
                          f"**Field:** `{item['field']}`\n\n"
                      )
          
                      report.write("**Unknown words:**\n\n")
          
                      for word in item["words"]:
                          report.write(f"- `{word}`\n")
          
                      report.write("\n")
          
                      report.write("```text\n")
                      report.write(item["text"][:5000])
                      report.write("\n```\n\n")
          
          print(
              f"Spellchecked {len(spellcheck_strings)} strings. "
              f"Found {len(findings)} entries with possible spelling issues."
          )
          PY

      - name: Run spellcheck
        run: |
          python3 spellcheck_json.py

      - name: Upload spellcheck report
        uses: actions/upload-artifact@v4
        with:
          name: spellcheck-report
          path: spellcheck-report.md
